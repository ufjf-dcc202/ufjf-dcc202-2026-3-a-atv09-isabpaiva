<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DCC 202 | Atividade 09 - Desconstructed Pancake </title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul>li { 
            border: 1px solid rgb(43, 66, 7);
            background-color: greenyellow;
        }

    .desconstructed-pancake{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    
    .desconstructed-pancake > * {
        flex: 1 0 120px;
    }

     </style>
</head>
<body>
    <main>
        <article> 
            <ul class="desconstructed-pancake">
                <li> Arthur </li>
                <li> Giovanna </li>
                <li> Isabella </li>
                <li> Laura </li>
            </ul>
        </article>
    </main>
</body>
</html>
